<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Triage Validation Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --primary: #0f766e;
            --primary-light: #f0fdfa;
            --red-flag: #e11d48;
            --red-flag-light: #fff1f2;
            --green-flag: #16a34a;
            --green-flag-light: #f0fdf4;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
        }

        .search-filter-box {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .filter-tab.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .case-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .case-item {
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .case-item:hover {
            background-color: var(--bg-primary);
            border-color: #cbd5e1;
        }

        .case-item.selected {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .case-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .case-id {
            font-weight: 700;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .case-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .case-badge.redflag {
            background-color: var(--red-flag-light);
            color: var(--red-flag);
        }

        .case-badge.greenflag {
            background-color: var(--green-flag-light);
            color: var(--green-flag);
        }

        .case-item-complaints {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .case-item-vitals {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
        }

        .content-pane {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-secondary);
        }

        .medical-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .medical-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--bg-primary);
            padding-bottom: 16px;
        }

        .patient-title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .patient-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 16px;
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .vital-box {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

        .vital-box.abnormal {
            border-color: #fecdd3;
            background-color: #fff1f2;
        }

        .vital-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .vital-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 6px;
        }

        .vital-value.abnormal {
            color: var(--red-flag);
        }

        .vital-status {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
        }

        .vital-status.abnormal {
            color: var(--red-flag);
        }

        .vital-status.normal {
            color: var(--green-flag);
        }

        .details-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .details-section h4 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        .clinical-reason-box {
            background-color: var(--primary-light);
            border: 1px solid #ccfbf1;
            color: #0f766e;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .clinical-reason-box.red {
            background-color: var(--red-flag-light);
            border-color: #fee2e2;
            color: #b91c1c;
        }

        .questionnaire-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .questionnaire-table th, .questionnaire-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .questionnaire-table th {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
        }

        .questionnaire-table td.question {
            font-weight: 600;
            width: 50%;
        }

        .questionnaire-table td.answer {
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>

        function renderCaseList() {

            const filteredCases = testCases.filter(c => {
                const matchesSearch = c.id.toLowerCase().includes(searchQuery.toLowerCase()) ||

                const matchesFilter = currentFilter === 'all' ||
                    (currentFilter === 'red' && c.ground_truth_redflag === 'Yes') ||
                    (currentFilter === 'green' && c.ground_truth_redflag === 'No');

                return matchesSearch && matchesFilter;
            });

                const isSelected = c.id === selectedCaseId;
                const item = document.createElement('div');
                item.className = `case-item ${isSelected ? 'selected' : ''}`;
                item.onclick = () => selectCase(c.id);

                const isRedFlag = c.ground_truth_redflag === 'Yes';
                const badgeClass = isRedFlag ? 'redflag' : 'greenflag';
                const badgeText = isRedFlag ? 'RED FLAG' : 'NORMAL';

                item.innerHTML = `
                    <div class="case-item-header">
                        <span class="case-id">#${idx + 1} - ${c.id.replace('case_', '')}</span>
                        <span class="case-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="case-item-complaints">Complaints: ${c.complaints.join(', ')}</div>
                    <div class="case-item-vitals">
                        <span>HR: <strong>${c.vitals.heart_rate} bpm</strong></span>
                        <span>RR: <strong>${c.vitals.respiratory_rate}</strong></span>
                        <span>Rhythm: <strong>${c.vitals.heart_beat_rhythm}</strong></span>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            if (filteredCases.length === 0) {
                listContainer.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No cases matched criteria.</div>';
            }
        }

        function selectCase(id) {
            selectedCaseId = id;
            renderCaseList();
            renderCaseDetails();
        }

        function renderCaseDetails() {
            const detailContainer = document.getElementById('detailContainer');
            const c = testCases.find(caseItem => caseItem.id === selectedCaseId);

            if (!c) {
                detailContainer.innerHTML = `
                    <div class="empty-state">
                        <p>Select a triage case from the list to view clinical details.</p>
                    </div>
                `;
                return;
            }

            const isRedFlag = c.ground_truth_redflag === 'Yes';
            const bannerClass = isRedFlag ? 'red' : 'green';
            const badgeClass = isRedFlag ? 'redflag' : 'greenflag';
            const badgeText = isRedFlag ? 'RED FLAG' : 'NORMAL';

            const isHRAbnormal = c.vitals.heart_rate < 60 || c.vitals.heart_rate > 100;
            const isRRAbnormal = c.vitals.respiratory_rate < 12 || c.vitals.respiratory_rate > 20;
            const isRhythmAbnormal = c.vitals.heart_beat_rhythm !== 'Normal';

            let questionsHtml = '';
            Object.entries(c.details).forEach(([key, val]) => {
                const questionText = labelMap[key] || key;
                const formattedVal = Array.isArray(val) ? val.join(', ') : val;
                questionsHtml += `
                    <tr>
                        <td class="question">${questionText}</td>
                        <td class="answer">${formattedVal}</td>
                    </tr>
                `;
            });

            detailContainer.innerHTML = `
                <div class="medical-card">
                    <div class="medical-card-header">
                        <div>
                            <h3 class="patient-title">Patient Profile: ${c.id}</h3>
                            <div class="patient-meta">
                                <span><strong>Age:</strong> ${c.age}</span>
                                <span><strong>Gender:</strong> ${c.gender}</span>
                                <span><strong>Chief Complaints:</strong> ${c.complaints.join(', ')}</span>
                            </div>
                        </div>
                        <div>
                            <span class="case-badge ${badgeClass}" style="font-size: 0.95rem; padding: 6px 14px;">${badgeText}</span>
                        </div>
                    </div>

                    <div class="details-section">
                        <h4>💓 Vital Signs Panel</h4>
                        <div class="vitals-grid">
                            <div class="vital-box ${isHRAbnormal ? 'abnormal' : ''}">
                                <div class="vital-label">Heart Rate</div>
                                <div class="vital-value ${isHRAbnormal ? 'abnormal' : ''}">${c.vitals.heart_rate} <span style="font-size: 0.9rem; font-weight: normal;">bpm</span></div>
                                <span class="vital-status ${isHRAbnormal ? 'abnormal' : 'normal'}">${isHRAbnormal ? '⚠ Abnormal' : '✓ Normal'}</span>
                            </div>
                            <div class="vital-box ${isRRAbnormal ? 'abnormal' : ''}">
                                <div class="vital-label">Respiratory Rate</div>
                                <div class="vital-value ${isRRAbnormal ? 'abnormal' : ''}">${c.vitals.respiratory_rate} <span style="font-size: 0.9rem; font-weight: normal;">breaths/min</span></div>
                                <span class="vital-status ${isRRAbnormal ? 'abnormal' : 'normal'}">${isRRAbnormal ? '⚠ Abnormal (Tachypnea)' : '✓ Normal'}</span>
                            </div>
                            <div class="vital-box ${isRhythmAbnormal ? 'abnormal' : ''}">
                                <div class="vital-label">Heart Rhythm</div>
                                <div class="vital-value" style="font-size: 1.25rem; margin-top: 10px;">${c.vitals.heart_beat_rhythm}</div>
                                <span class="vital-status ${isRhythmAbnormal ? 'abnormal' : 'normal'}">${isRhythmAbnormal ? '⚠ Irregular' : '✓ Normal'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="details-section">
                        <h4>⚖️ Clinical Evaluation Reasoning</h4>
                        <div class="clinical-reason-box ${bannerClass}">
                            <strong>Reasoning:</strong> ${c.clinical_reason}
                        </div>
                    </div>

                    <div class="details-section">
                        <h4>📝 Questionnaire Responses (Translated History)</h4>
                        <table class="questionnaire-table">
                            <thead>
                                <tr>
                                    <th>Question</th>
                                    <th>Patient Response</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${questionsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCaseList();
        });

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            renderCaseList();
        }

        renderCaseList();
        renderCaseDetails();
    </script>
</body>
</html>
